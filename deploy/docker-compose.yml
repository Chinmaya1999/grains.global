# Runs on the EC2 server. Images are built by GitHub Actions and pulled from Docker Hub.
name: grains
services:
  server:
    image: ${DOCKERHUB_USER}/grains-server:${TAG}
    restart: unless-stopped
    env_file: .env.app          # secrets, written by the deploy job (never committed)
    expose: ["5050"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  web:
    image: ${DOCKERHUB_USER}/grains-web:${TAG}
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]   # local only (health checks); public traffic arrives through Caddy
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, server]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates live here; keep it across deploys
      - caddy_config:/config
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  caddy_data:
  caddy_config:
